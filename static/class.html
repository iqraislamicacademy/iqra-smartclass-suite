<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Iqra Islamic Academy — Live Classroom</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100vh; height: 100dvh;
      background: #020617; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Join Gate Overlay (With Password Protection) -->
  <div id="joinGateOverlay" style="position: fixed; inset: 0; background: rgba(2, 6, 23, 0.96); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #0f172a; border: 1px solid #1e293b; width: 370px; max-width: 94vw; border-radius: 18px; padding: 24px; text-align: center; box-shadow: 0 24px 48px rgba(0,0,0,0.5);">
      <div style="width: 50px; height: 50px; border-radius: 14px; background: rgba(56, 189, 248, 0.14); color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 10px;">
        <i class="fa-solid fa-mosque"></i>
      </div>
      <div style="font-size: 13px; font-weight: 800; color: #38bdf8; letter-spacing: 0.3px;">Iqra Islamic Academy</div>
      <h2 style="margin: 4px 0 6px; font-size: 19px; font-weight: 800; color: #f8fafc;">Join Live Classroom</h2>
      <p id="joinRoomLabel" style="margin: 0 0 14px; font-size: 12px; color: #94a3b8;">Connecting to classroom...</p>

      <div id="joinErrorBanner" style="display: none; background: rgba(220, 38, 38, 0.18); border: 1px solid rgba(239, 68, 68, 0.55); color: #fca5a5; font-size: 12px; font-weight: 600; padding: 8px 10px; border-radius: 10px; margin-bottom: 10px;"></div>

      <input id="studentNameInput" type="text" placeholder="Enter your First & Last Name..." style="
        width: 100%; padding: 11px 13px; border-radius: 11px;
        border: 1.5px solid #334155; background: #1e293b; color: #f8fafc;
        font-size: 15px; margin-bottom: 10px; outline: none;
      " />
      <input id="studentPasswordInput" type="password" placeholder="Enter Classroom Password..." style="
        width: 100%; padding: 11px 13px; border-radius: 11px;
        border: 1.5px solid #334155; background: #1e293b; color: #f8fafc;
        font-size: 15px; margin-bottom: 12px; outline: none;
      " />
      <button id="btnJoinClassroom" type="button" style="
        width: 100%; padding: 12px; border-radius: 11px; border: none;
        background: #16a34a; color: #ffffff; font-size: 14.5px; font-weight: 700; cursor: pointer;
      ">Join Class Now</button>
    </div>
  </div>

  <!-- Main Student Classroom Layout -->
  <div id="classroomRoot" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
    <!-- Top Header -->
    <header style="background: #0f172a; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; gap: 10px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex-shrink: 0;"></span>
        <div style="min-width: 0;">
          <div id="headerAcademyName" style="font-size: 13.5px; font-weight: 800; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            Iqra Islamic Academy
          </div>
          <div id="headerCourseTitle" style="font-size: 11.5px; font-weight: 600; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            Live Session
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
        <button id="btnFitFillToggle" type="button" title="Toggle Proportional Fit / Fill Screen" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-compress"></i> Fit Screen
        </button>
        <button id="btnToggleSidebar" type="button" style="position: relative; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-table-columns"></i> Panel
          <span id="unreadBadge" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 999px; align-items: center; justify-content: center; padding: 0 3px;">0</span>
        </button>
        <button id="btnFullscreen" type="button" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
      </div>
    </header>
    <!-- Iqra SmartClass Live Audio Control Bar (Top Bar) -->
<div id="iqraLiveAudioBar" class="iqra-live-audio-bar" role="region" aria-label="Live Class Audio Controls">
  <div class="iqra-audio-brand">
    <i class="fa-solid fa-headphones-simple"></i>
    <span>Live Audio</span>
  </div>

  <!-- Speaker / Headphone Mode Switcher -->
  <div class="iqra-audio-mode-group" role="group" aria-label="Audio Output Mode">
    <button type="button" id="btnAudioSpeakerMode" class="iqra-audio-mode-btn active" data-audio-mode="speaker" title="Play through device loudspeaker">
      <i class="fa-solid fa-volume-high"></i>
      <span>Speaker</span>
    </button>
    <button type="button" id="btnAudioHeadphoneMode" class="iqra-audio-mode-btn" data-audio-mode="headphone" title="Use connected headphone or earpiece">
      <i class="fa-solid fa-headphones"></i>
      <span>Headphone</span>
    </button>
  </div>

  <!-- Volume Adjust Control -->
  <div class="iqra-audio-volume-box" title="Adjust Live Class Volume">
    <button type="button" id="btnAudioMuteToggle" class="iqra-audio-mute-btn" aria-label="Mute or Unmute">
      <i id="iqraAudioVolumeIcon" class="fa-solid fa-volume-high"></i>
    </button>
    <input
      type="range"
      id="iqraLiveVolumeSlider"
      class="iqra-audio-slider"
      min="0"
      max="150"
      value="100"
      step="1"
      aria-label="Live Class Volume"
    />
    <span id="iqraLiveVolumeValue" class="iqra-audio-vol-text">100%</span>
  </div>

  <!-- Compact Status Indicator -->
  <span id="iqraAudioDeviceStatus" class="iqra-audio-status">Speaker Ready</span>
</div>

<style>
  .iqra-live-audio-bar {
    position: sticky;
    top: 0;
    z-index: 950;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 14px;
    background: #0f172a;
    color: #f8fafc;
    border-bottom: 1px solid #334155;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .iqra-audio-brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    white-space: nowrap;
  }

  .iqra-audio-mode-group {
    display: inline-flex;
    align-items: center;
    background: #020617;
    padding: 3px;
    border-radius: 9px;
    border: 1px solid #1e293b;
    gap: 3px;
  }

  .iqra-audio-mode-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .iqra-audio-mode-btn:hover {
    color: #e2e8f0;
  }

  .iqra-audio-mode-btn.active {
    background: #0284c7;
    color: #ffffff;
  }

  .iqra-audio-volume-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 4px 10px;
    border-radius: 9px;
  }

  .iqra-audio-mute-btn {
    background: transparent;
    border: none;
    color: #38bdf8;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .iqra-audio-slider {
    width: 110px;
    accent-color: #38bdf8;
    cursor: pointer;
  }

  .iqra-audio-vol-text {
    min-width: 38px;
    text-align: right;
    font-size: 11.5px;
    font-weight: 700;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .iqra-audio-status {
    font-size: 11px;
    font-weight: 600;
    color: #34d399;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .iqra-live-audio-bar {
      padding: 7px 10px;
      gap: 8px;
    }
    .iqra-audio-slider {
      width: 84px;
    }
  }
</style>

    <!-- Center Stage + Collapsible Right Sidebar -->
    <main style="flex: 1; display: flex; overflow: hidden; position: relative; width: 100%;">
      <section style="flex: 1; display: flex; align-items: center; justify-content: center; background: #000000; padding: 0; overflow: hidden; position: relative; width: 100%; height: 100%;">
        <div id="stageFrameContainer" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000000; position: relative;">
          <video id="mainStageVideo" autoplay playsinline webkit-playsinline style="width: 100%; height: 100%; object-fit: contain; display: none; background: #000000;"></video>

          <div id="stageWaitingBox" style="text-align: center; padding: 24px; max-width: 380px;">
            <div id="stageHostAvatarBox" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(56, 189, 248, 0.14); color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; margin: 0 auto 14px; overflow: hidden;">
              <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h3 id="stageWaitingTitle" style="margin: 0 0 6px; font-size: 18px; font-weight: 700;">Connected to Classroom</h3>
            <p id="stageWaitingText" style="margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.5;">
              Waiting for the host to start video or screen broadcast...
            </p>
          </div>

          <div id="hostRoundCamBubble" style="
            display: none; position: absolute; bottom: 16px; right: 16px;
            width: 112px; height: 112px; border-radius: 50%;
            border: 3px solid #38bdf8; background: #0f172a;
            box-shadow: 0 10px 28px rgba(0,0,0,0.65);
            overflow: hidden; z-index: 30; cursor: grab; touch-action: none;
          ">
            <video id="hostRoundCamVideo" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
          </div>
        </div>
      </section>

      <!-- Collapsible Right Sidebar -->
      <aside id="rightSidebar" style="width: 285px; max-width: 84vw; background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; flex-shrink: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; background: #1e293b; padding-right: 6px;">
          <div style="display: flex; flex: 1;">
            <button id="tabMessages" type="button" style="flex: 1; padding: 9px 6px; border: none; background: #0f172a; color: #38bdf8; font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 2px solid #38bdf8;">
              Messages
            </button>
            <button id="tabStudents" type="button" style="flex: 1; padding: 9px 6px; border: none; background: transparent; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer;">
              Students
            </button>
          </div>
          <button id="btnHideSidebar" type="button" title="Hide Panel for Full Screen Board" style="background: none; border: none; color: #94a3b8; font-size: 14px; padding: 6px 8px; cursor: pointer;">✕</button>
        </div>

        <div id="panelMessages" style="display: flex; flex: 1; flex-direction: column; overflow: hidden;">
          <div id="chatMessagesList" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
          <div style="padding: 8px; border-top: 1px solid #1e293b; display: flex; gap: 6px;">
            <input id="chatInput" type="text" placeholder="Type a message..." style="
              flex: 1; min-width: 0; background: #1e293b; border: 1px solid #334155;
              border-radius: 8px; padding: 7px 10px; font-size: 16px; color: #f8fafc; outline: none;
            " />
            <button id="btnSendChat" type="button" style="
              background: #0284c7; color: #ffffff; border: none; border-radius: 8px;
              padding: 0 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
            ">Send</button>
          </div>
        </div>

        <div id="panelStudents" style="display: none; flex: 1; overflow-y: auto; padding: 10px;"></div>
      </aside>
    </main>

    <!-- Bottom Student Control Bar -->
    <footer style="background: #0f172a; padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid #1e293b; flex-shrink: 0; flex-wrap: wrap;">
      <button id="btnMicToggle" type="button" style="background: #dc2626; color: #ffffff; border: none; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
        <i class="fa-solid fa-microphone-slash"></i> Mic Off
      </button>
      <button id="btnCamToggle" type="button" style="background: #dc2626; color: #ffffff; border: none; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
        <i class="fa-solid fa-video-slash"></i> Cam Off
      </button>
      <button id="btnRaiseHand" type="button" style="background: #f59e0b; color: #0f172a; border: none; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
        <i class="fa-solid fa-hand"></i> Raise Hand
      </button>
      <button id="btnLeaveCall" type="button" style="background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
        <i class="fa-solid fa-phone-slash"></i> Leave Call
      </button>
    </footer>
  </div>

  <!-- Toast Banner -->
  <div id="studentToast" style="display: none; position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #ffffff; border: 1px solid #334155; padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600; z-index: 9999; box-shadow: 0 6px 18px rgba(0,0,0,0.35);"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get("room") || params.get("liveClass") || "";

      const joinGate = document.getElementById("joinGateOverlay");
      const joinRoomLabel = document.getElementById("joinRoomLabel");
      const joinErrorBanner = document.getElementById("joinErrorBanner");
      const nameInput = document.getElementById("studentNameInput");
      const passInput = document.getElementById("studentPasswordInput");
      const btnJoin = document.getElementById("btnJoinClassroom");

      if (!roomId) {
        joinRoomLabel.textContent = "Invalid classroom link. Please ask your teacher for a valid invite link.";
        nameInput.style.display = "none";
        passInput.style.display = "none";
        btnJoin.style.display = "none";
        return;
      }
      joinRoomLabel.innerHTML = `Classroom ID: <b style="color:#38bdf8;">${escapeHtml(roomId)}</b>`;

      let studentName = "Student";
      let studentPassword = "";
      let peer = null;
      let hostConn = null;
      let localStream = null;
      let outgoingCall = null;
      let micOn = false;
      let camOn = false;
      let micLockedByHost = false;
      let camLockedByHost = false;
      let sidebarVisible = true;
      let activeTab = "messages";
      let unreadCount = 0;
      let latestRoster = [];
      let fitMode = "contain";
      let wakeLockSentinel = null;
      let audioMonitorTimer = null;

      function showJoinGateError(msg) {
        joinErrorBanner.textContent = msg;
        joinErrorBanner.style.display = "block";
        btnJoin.disabled = false;
        btnJoin.textContent = "Join Class Now";
      }

      async function enableScreenWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLockSentinel = await navigator.wakeLock.request("screen");
          }
        } catch (e) {}
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          enableScreenWakeLock();
          const v = document.getElementById("mainStageVideo");
          if (v && v.srcObject && v.paused) v.play().catch(() => {});
        }
      });

      function escapeHtml(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function getInitials(name) {
        const parts = String(name || "ST").trim().split(/\s+/).filter(Boolean);
        if (parts.length === 0) return "ST";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function getAvatarColor(name) {
        const colors = ["#0284c7", "#16a34a", "#7c3aed", "#d97706", "#db2777", "#0891b2", "#4f46e5"];
        let h = 0;
        for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return colors[Math.abs(h) % colors.length];
      }

      function showToast(msg) {
        const t = document.getElementById("studentToast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(t._timer);
        t._timer = setTimeout(() => { t.style.display = "none"; }, 3500);
      }

      (function initDraggableRoundHostBubble() {
        const bubble = document.getElementById("hostRoundCamBubble");
        if (!bubble) return;
        let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

        bubble.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          dragging = true;
          bubble.style.cursor = "grabbing";
          const rect = bubble.getBoundingClientRect();
          const parentRect = bubble.parentElement.getBoundingClientRect();
          origLeft = rect.left - parentRect.left;
          origTop = rect.top - parentRect.top;
          startX = e.clientX;
          startY = e.clientY;
          bubble.style.right = "auto";
          bubble.style.bottom = "auto";
          bubble.style.left = `${origLeft}px`;
          bubble.style.top = `${origTop}px`;
          try { bubble.setPointerCapture(e.pointerId); } catch (err) {}
        });

        bubble.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const parentRect = bubble.parentElement.getBoundingClientRect();
          const maxLeft = Math.max(0, parentRect.width - bubble.offsetWidth);
          const maxTop = Math.max(0, parentRect.height - bubble.offsetHeight);
          const nextLeft = Math.max(0, Math.min(maxLeft, origLeft + (e.clientX - startX)));
          const nextTop = Math.max(0, Math.min(maxTop, origTop + (e.clientY - startY)));
          bubble.style.left = `${nextLeft}px`;
          bubble.style.top = `${nextTop}px`;
        });

        const endDrag = (e) => {
          if (!dragging) return;
          dragging = false;
          bubble.style.cursor = "grab";
          try { bubble.releasePointerCapture(e.pointerId); } catch (err) {}
        };
        bubble.addEventListener("pointerup", endDrag);
        bubble.addEventListener("pointercancel", endDrag);
      })();

      function appendMessage(sender, text, isSelf, isSystem) {
        const list = document.getElementById("chatMessagesList");
        const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const div = document.createElement("div");

        if (isSystem) {
          div.style.cssText = "text-align: center; font-size: 11px; color: #94a3b8; margin: 6px 0;";
          div.textContent = text;
        } else {
          div.style.cssText = `display: flex; flex-direction: column; align-items: ${isSelf ? "flex-end" : "flex-start"}; margin-bottom: 8px;`;
          div.innerHTML = `
            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 2px; padding: 0 4px;">${escapeHtml(sender)} • ${time}</div>
            <div style="max-width: 86%; padding: 7px 10px; border-radius: 11px; font-size: 12px; line-height: 1.4; word-break: break-word; background: ${isSelf ? "#0284c7" : "#1e293b"}; color: #f8fafc; border: 1px solid ${isSelf ? "#0369a1" : "#334155"};">
              ${escapeHtml(text)}
            </div>
          `;
        }
        list.appendChild(div);
        list.scrollTop = list.scrollHeight;

        if (!isSelf && !(sidebarVisible && activeTab === "messages")) {
          unreadCount += 1;
          const badge = document.getElementById("unreadBadge");
          badge.style.display = "inline-flex";
          badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
        }
      }

      function renderStudentsPanel() {
        const panel = document.getElementById("panelStudents");
        panel.innerHTML = "";

        const selfCard = document.createElement("div");
        selfCard.style.cssText = "background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px; margin-bottom: 8px;";
        const selfInitials = getInitials(studentName);
        const selfBg = getAvatarColor(studentName);
        const hasSelfCam = camOn && localStream && localStream.getVideoTracks().length > 0;

        selfCard.innerHTML = `
          <div style="position: relative; width: 100%; height: 96px; border-radius: 9px; background: #0f172a; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <video id="sidebarSelfVideo" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: ${hasSelfCam ? "block" : "none"};"></video>
            <div style="display: ${hasSelfCam ? "none" : "flex"}; width: 46px; height: 46px; border-radius: 50%; background: ${selfBg}; color: #fff; font-size: 16px; font-weight: 800; align-items: center; justify-content: center;">
              ${escapeHtml(selfInitials)}
            </div>
            <div style="position: absolute; bottom: 5px; left: 6px; right: 6px; display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.82); padding: 2px 7px; border-radius: 6px;">
              <span style="font-size: 11px; font-weight: 600; color: #f8fafc;">${escapeHtml(studentName)} (You)</span>
              <span style="font-size: 10px; color: ${micOn ? "#22c55e" : "#ef4444"};">
                <i class="fa-solid ${micOn ? "fa-microphone" : "fa-microphone-slash"}"></i>
              </span>
            </div>
          </div>
        `;
        panel.appendChild(selfCard);

        if (hasSelfCam) {
          const sv = document.getElementById("sidebarSelfVideo");
          if (sv) {
            sv.srcObject = localStream;
            sv.play().catch(() => {});
          }
        }

        latestRoster.forEach((p) => {
          if (peer && p.id === peer.id) return;
          const row = document.createElement("div");
          row.style.cssText = "display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px 10px; margin-bottom: 7px;";
          const bg = getAvatarColor(p.name);
          row.innerHTML = `
            <div style="display: flex; align-items: center; gap: 9px; min-width: 0;">
              <div style="width: 34px; height: 34px; border-radius: 50%; background: ${bg}; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;">
                ${p.avatar ? `<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover;" />` : escapeHtml(p.initials || getInitials(p.name))}
              </div>
              <div style="min-width: 0;">
                <div style="font-size: 12.5px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(p.name)}</div>
                <div style="font-size: 10.5px; color: #94a3b8;">${p.isHost ? "Host" : "Student"}</div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px;">
              <span style="color: ${p.micOn ? "#22c55e" : "#ef4444"};"><i class="fa-solid ${p.micOn ? "fa-microphone" : "fa-microphone-slash"}"></i></span>
              <span style="color: ${p.camOn ? "#22c55e" : "#ef4444"};"><i class="fa-solid ${p.camOn ? "fa-video" : "fa-video-slash"}"></i></span>
            </div>
          `;
          panel.appendChild(row);
        });
      }

      function updateMediaButtonsUI() {
        const micBtn = document.getElementById("btnMicToggle");
        const camBtn = document.getElementById("btnCamToggle");

        if (micLockedByHost) {
          micBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Mic Disabled`;
          micBtn.style.background = "#991b1b";
          micBtn.style.color = "#fecaca";
        } else {
          micBtn.style.color = "#ffffff";
          micBtn.style.background = micOn ? "#16a34a" : "#dc2626";
          micBtn.innerHTML = micOn ? `<i class="fa-solid fa-microphone"></i> Mic On` : `<i class="fa-solid fa-microphone-slash"></i> Mic Off`;
        }

        if (camLockedByHost) {
          camBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Cam Disabled`;
          camBtn.style.background = "#991b1b";
          camBtn.style.color = "#fecaca";
        } else {
          camBtn.style.color = "#ffffff";
          camBtn.style.background = camOn ? "#16a34a" : "#dc2626";
          camBtn.innerHTML = camOn ? `<i class="fa-solid fa-video"></i> Cam On` : `<i class="fa-solid fa-video-slash"></i> Cam Off`;
        }
      }

      function stopAudioLevelMonitor() {
        if (audioMonitorTimer) {
          clearInterval(audioMonitorTimer);
          audioMonitorTimer = null;
        }
      }

      function startAudioLevelMonitor(stream) {
        stopAudioLevelMonitor();
        if (!stream || !stream.getAudioTracks().length) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const src = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          src.connect(analyser);
          const buf = new Uint8Array(analyser.frequencyBinCount);
          let wasSpeaking = false;

          audioMonitorTimer = setInterval(() => {
            if (!micOn || !hostConn || !hostConn.open) return;
            analyser.getByteFrequencyData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) sum += buf[i];
            const avg = sum / buf.length;
            const isSpeaking = avg > 18;
            if (isSpeaking && !wasSpeaking) {
              hostConn.send({ type: "student-speaking", speaking: true });
            }
            wasSpeaking = isSpeaking;
          }, 400);
        } catch (e) {}
      }

      async function syncOwnMedia() {
        stopAudioLevelMonitor();
        if (!micOn && !camOn) {
          if (localStream) {
            localStream.getTracks().forEach((t) => t.stop());
            localStream = null;
          }
          if (outgoingCall) {
            try { outgoingCall.close(); } catch (e) {}
            outgoingCall = null;
          }
        } else {
          try {
            if (localStream) localStream.getTracks().forEach((t) => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ audio: micOn, video: camOn });
            if (micOn) startAudioLevelMonitor(localStream);
            if (peer && localStream) {
              if (outgoingCall) { try { outgoingCall.close(); } catch (e) {} }
              outgoingCall = peer.call(roomId, localStream);
            }
          } catch (err) {
            micOn = false;
            camOn = false;
            showToast("Unable to access microphone or camera on this device.");
          }
        }

        updateMediaButtonsUI();
        renderStudentsPanel();
        if (hostConn && hostConn.open) {
          hostConn.send({ type: "student-media-state", micOn, camOn });
        }
      }

      function disconnectAndExit(reasonTitle, reasonMsg) {
        stopAudioLevelMonitor();
        if (wakeLockSentinel) {
          try { wakeLockSentinel.release(); } catch (e) {}
          wakeLockSentinel = null;
        }
        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop());
          localStream = null;
        }
        if (outgoingCall) { try { outgoingCall.close(); } catch (e) {} }
        if (hostConn) { try { hostConn.close(); } catch (e) {} }
        if (peer) { try { peer.destroy(); } catch (e) {} }

        document.body.innerHTML = `
          <div style="height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #f8fafc; text-align: center; padding: 24px;">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); color: #f87171; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 14px;">
              <i class="fa-solid fa-phone-slash"></i>
            </div>
            <h2 style="margin: 0 0 8px; font-size: 21px; font-weight: 800;">${escapeHtml(reasonTitle)}</h2>
            <p style="margin: 0 0 20px; font-size: 13.5px; color: #94a3b8; max-width: 360px; line-height: 1.5;">${escapeHtml(reasonMsg)}</p>
            <button onclick="window.location.reload()" style="background: #0284c7; color: #ffffff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;">
              Rejoin Classroom
            </button>
          </div>
        `;
      }

      function connectToClassroom() {
        if (peer && !peer.destroyed) {
          try { peer.destroy(); } catch (e) {}
        }

        peer = new Peer();

        peer.on("open", () => {
          hostConn = peer.connect(roomId, { reliable: true });

          hostConn.on("open", () => {
            hostConn.send({
              type: "student-hello",
              name: studentName,
              password: studentPassword,
              micOn,
              camOn
            });
          });

          hostConn.on("data", (data) => {
            if (!data) return;

            if (data.type === "auth-rejected") {
              try { hostConn.close(); } catch (e) {}
              try { peer.destroy(); } catch (e) {}
              showJoinGateError(data.reason || "Incorrect classroom password. Access denied.");
              return;
            }

            if (data.type === "auth-accepted") {
              joinGate.style.display = "none";
              enableScreenWakeLock();
              renderStudentsPanel();
              hostConn.send({ type: "request-stream" });
              return;
            }

            if (data.type === "class-meta") {
              joinGate.style.display = "none";
              enableScreenWakeLock();
              if (data.academyName) document.getElementById("headerAcademyName").textContent = data.academyName;
              if (data.courseTitle) document.getElementById("headerCourseTitle").textContent = data.courseTitle;
              const avatarBox = document.getElementById("stageHostAvatarBox");
              if (avatarBox && data.teacherAvatar) {
                avatarBox.innerHTML = `<img src="${data.teacherAvatar}" alt="Host" style="width:100%;height:100%;object-fit:cover;" />`;
              } else if (avatarBox && data.teacherName) {
                avatarBox.textContent = getInitials(data.teacherName);
              }
            } else if (data.type === "host-stage-state") {
              const vid = document.getElementById("mainStageVideo");
              const wait = document.getElementById("stageWaitingBox");
              if (data.hasActiveVideo) {
                if (wait) wait.style.display = "none";
                if (vid) vid.style.display = "block";
              } else {
                if (vid) vid.style.display = "none";
                if (wait) wait.style.display = "block";
                document.getElementById("stageWaitingTitle").textContent = data.teacherName || "Host";
                document.getElementById("stageWaitingText").textContent = "Host camera and screen sharing are currently off.";
              }
            } else if (data.type === "roster-update") {
              latestRoster = data.roster || [];
              renderStudentsPanel();
            } else if (data.type === "host-control") {
              if (data.action === "force-mute-mic") {
                micOn = false;
                syncOwnMedia();
                showToast("The host muted your microphone.");
              } else if (data.action === "force-stop-cam") {
                camOn = false;
                syncOwnMedia();
                showToast("The host turned off your camera.");
              } else if (data.action === "lock-mic") {
                micLockedByHost = true;
                micOn = false;
                syncOwnMedia();
                showToast("The host disabled your microphone.");
              } else if (data.action === "unlock-mic") {
                micLockedByHost = false;
                updateMediaButtonsUI();
                showToast("The host re-enabled your microphone.");
              } else if (data.action === "lock-cam") {
                camLockedByHost = true;
                camOn = false;
                syncOwnMedia();
                showToast("The host disabled your camera.");
              } else if (data.action === "unlock-cam") {
                camLockedByHost = false;
                updateMediaButtonsUI();
                showToast("The host re-enabled your camera.");
              } else if (data.action === "kicked") {
                disconnectAndExit("Removed from Classroom", "You have been removed from this session by the host.");
              }
            } else if (data.type === "host-left-temp") {
              const vid = document.getElementById("mainStageVideo");
              const wait = document.getElementById("stageWaitingBox");
              const txt = document.getElementById("stageWaitingText");
              if (vid) vid.style.display = "none";
              if (wait) wait.style.display = "block";
              if (txt) txt.textContent = "The host temporarily left the session. Please wait...";
            } else if (data.type === "class-ended") {
              disconnectAndExit("Class Ended", "The host has ended this live session for all participants.");
            } else if (data.type === "chat-history" && Array.isArray(data.history)) {
              data.history.forEach((m) => appendMessage(m.sender, m.text, false, m.isSystem));
            } else if (data.type === "chat-message") {
              if (data.sender !== studentName) appendMessage(data.sender, data.text, false, false);
            } else if (data.type === "system-msg") {
              appendMessage("System", data.text, false, true);
            }
          });

          hostConn.on("close", () => {
            if (joinGate.style.display === "none") {
              showToast("Disconnected from host.");
            }
          });
        });

        peer.on("error", () => {
          showJoinGateError("Classroom is currently offline or not started by the host yet.");
        });

        peer.on("call", (call) => {
          call.answer();
          call.on("stream", (remoteStream) => {
            const isRoundCam = call.metadata && call.metadata.streamRole === "host-round-cam";
            if (isRoundCam) {
              const bubble = document.getElementById("hostRoundCamBubble");
              const camVid = document.getElementById("hostRoundCamVideo");
              if (remoteStream && remoteStream.getVideoTracks().length > 0) {
                bubble.style.display = "block";
                camVid.srcObject = remoteStream;
                camVid.play().catch(() => {});
              } else {
                bubble.style.display = "none";
              }
              remoteStream.getVideoTracks().forEach((t) => {
                t.onended = () => { bubble.style.display = "none"; };
              });
              return;
            }

            const bubble = document.getElementById("hostRoundCamBubble");
            if (!call.metadata || call.metadata.streamRole !== "screen-share") {
              if (bubble) bubble.style.display = "none";
            }

            const vid = document.getElementById("mainStageVideo");
            const wait = document.getElementById("stageWaitingBox");
            if (remoteStream && remoteStream.getVideoTracks().length > 0) {
              if (wait) wait.style.display = "none";
              vid.style.display = "block";
            }
            vid.srcObject = remoteStream;
            vid.play().catch(() => {});
          });
        });
      }

      const startJoin = () => {
        joinErrorBanner.style.display = "none";
        studentName = (nameInput.value || "").trim() || "Student";
        studentPassword = (passInput.value || "").trim();
        btnJoin.disabled = true;
        btnJoin.textContent = "Verifying...";
        connectToClassroom();
      };
      btnJoin.onclick = startJoin;
      nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") passInput.focus(); });
      passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") startJoin(); });

      document.getElementById("btnMicToggle").onclick = () => {
        if (micLockedByHost) {
          showToast("Your microphone is disabled by the host.");
          return;
        }
        micOn = !micOn;
        syncOwnMedia();
      };

      document.getElementById("btnCamToggle").onclick = () => {
        if (camLockedByHost) {
          showToast("Your camera is disabled by the host.");
          return;
        }
        camOn = !camOn;
        syncOwnMedia();
      };

      document.getElementById("btnRaiseHand").onclick = () => {
        if (hostConn && hostConn.open) {
          hostConn.send({ type: "raise-hand", studentName });
          showToast("Hand raised. The host has been notified.");
        }
      };

      document.getElementById("btnLeaveCall").onclick = () => {
        disconnectAndExit("You Left the Classroom", "You have disconnected from the live session.");
      };

      const fitBtn = document.getElementById("btnFitFillToggle");
      fitBtn.onclick = () => {
        fitMode = fitMode === "contain" ? "fill" : "contain";
        const vid = document.getElementById("mainStageVideo");
        if (vid) vid.style.objectFit = fitMode;
        fitBtn.innerHTML = fitMode === "contain"
          ? `<i class="fa-solid fa-compress"></i> Fit Screen`
          : `<i class="fa-solid fa-up-right-and-down-left-from-center"></i> Stretch Fill`;
      };

      const sidebar = document.getElementById("rightSidebar");
      const panelMsg = document.getElementById("panelMessages");
      const panelStd = document.getElementById("panelStudents");
      const tabMsg = document.getElementById("tabMessages");
      const tabStd = document.getElementById("tabStudents");

      tabMsg.onclick = () => {
        activeTab = "messages";
        tabMsg.style.background = "#0f172a";
        tabMsg.style.color = "#38bdf8";
        tabMsg.style.borderBottom = "2px solid #38bdf8";
        tabStd.style.background = "transparent";
        tabStd.style.color = "#94a3b8";
        tabStd.style.borderBottom = "none";
        panelMsg.style.display = "flex";
        panelStd.style.display = "none";
        unreadCount = 0;
        document.getElementById("unreadBadge").style.display = "none";
      };

      tabStd.onclick = () => {
        activeTab = "students";
        tabStd.style.background = "#0f172a";
        tabStd.style.color = "#38bdf8";
        tabStd.style.borderBottom = "2px solid #38bdf8";
        tabMsg.style.background = "transparent";
        tabMsg.style.color = "#94a3b8";
        tabMsg.style.borderBottom = "none";
        panelMsg.style.display = "none";
        panelStd.style.display = "block";
        renderStudentsPanel();
      };

      const toggleSidebar = (show) => {
        sidebarVisible = show;
        sidebar.style.display = show ? "flex" : "none";
        if (show && activeTab === "messages") {
          unreadCount = 0;
          document.getElementById("unreadBadge").style.display = "none";
        }
      };

      document.getElementById("btnToggleSidebar").onclick = () => toggleSidebar(!sidebarVisible);
      document.getElementById("btnHideSidebar").onclick = () => toggleSidebar(false);

      const chatInput = document.getElementById("chatInput");
      const sendChat = () => {
        const txt = (chatInput.value || "").trim();
        if (!txt || !hostConn || !hostConn.open) return;
        chatInput.value = "";
        appendMessage(studentName, txt, true, false);
        hostConn.send({ type: "chat-message", sender: studentName, text: txt });
      };
      document.getElementById("btnSendChat").onclick = sendChat;
      chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

      document.getElementById("btnFullscreen").onclick = () => {
        const root = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (root.requestFullscreen) {
            root.requestFullscreen().catch(() => {});
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          } else {
            window.scrollTo(0, 1);
            showToast("Tip: Tap Share → Add to Home Screen on iPhone/iPad for full-screen mode.");
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      };
    })();
  </script>
</body>
</html>
